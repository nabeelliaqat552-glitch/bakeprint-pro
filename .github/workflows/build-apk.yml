name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "BakePrintPro-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: BakePrintPro-APK
          path: BakePrintPro-*.apk

      - name: Publish download (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" "BakePrintPro-v1.0.${{ github.run_number }}.apk" \
            --title "BakePrint Pro v1.0.${{ github.run_number }}" \
            --notes "Phone par neeche wali .apk file download karein aur install karein. Download the .apk file below and install it on your Android phone." \
            --latest
